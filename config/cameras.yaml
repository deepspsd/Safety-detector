# cameras.yaml — CCTV Stream Configuration
# Format:
#   camera_id: Unique string/int identifier
#   name: Human-friendly name
#   rtsp_url: RTSP URL or environment variable ${ENV_VAR}
#   floor: Building floor / area (ground | first | second | shop)
#   zone_type: Default camera role tag (entrance | packing | lift | default)
#   enabled: true / false
#   frame_rate_target: Target inference FPS (default 5)

cameras:
  - camera_id: shop_01
    name: "Shop Front Counter"
    rtsp_url: "rtsp://username:password@192.168.1.101:554/stream1"
    floor: "shop"
    zone_type: "shop_counter"
    enabled: true
    frame_rate_target: 5

  - camera_id: ground_entrance
    name: "Ground Floor Main Entrance"
    rtsp_url: "rtsp://username:password@192.168.1.102:554/stream1"
    floor: "ground"
    zone_type: "entrance"
    enabled: true
    frame_rate_target: 5

  - camera_id: ground_dough
    name: "Ground Floor Dough Section"
    rtsp_url: "rtsp://username:password@192.168.1.103:554/stream1"
    floor: "ground"
    zone_type: "dough_table"
    enabled: true
    frame_rate_target: 5

  - camera_id: ground_packing
    name: "Ground Floor Packing Area"
    rtsp_url: "rtsp://username:password@192.168.1.104:554/stream1"
    floor: "ground"
    zone_type: "packing"
    enabled: true
    frame_rate_target: 5

  - camera_id: second_oven
    name: "Second Floor Oven & Cooking"
    rtsp_url: "rtsp://username:password@192.168.1.105:554/stream1"
    floor: "second"
    zone_type: "oven"
    enabled: true
    frame_rate_target: 5

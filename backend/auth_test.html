<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auth Test</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
  button { background: #1a1a2e; color: #0f0; border: 1px solid #0f0; padding: 8px 16px; cursor: pointer; margin: 4px; border-radius: 4px; }
  button:hover { background: #0f0; color: #000; }
  input { background: #1a1a2e; color: #0f0; border: 1px solid #444; padding: 8px; width: 280px; border-radius: 4px; margin: 4px; }
  .result { background: #1a1a2e; border: 1px solid #333; padding: 12px; margin-top: 12px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; max-height: 250px; overflow-y: auto; }
  .ok { border-color: #0f0; }
  .err { border-color: #f00; color: #f77; }
  label { display: block; margin: 4px 0 2px; font-size: 0.85rem; color: #888; }
</style>
</head>
<body>
<h2>🔧 OccuSafe Auth Test</h2>
<p>Tests backend auth directly — bypasses Vite proxy.</p>

<div>
  <label>Backend URL:</label>
  <input id="base" value="http://localhost:8000" />
  <button onclick="testHealth()">▶ Test /health</button>
</div>

<hr style="border-color:#333;margin:16px 0">

<div>
  <label>Email:</label>
  <input id="email" value="testuser@example.com" />
  <label>Password:</label>
  <input id="pass" type="password" value="test1234" />
  <label>Name:</label>
  <input id="name" value="Test User" />
</div>

<div style="margin-top:8px">
  <button onclick="doSignup()">📝 Create Account</button>
  <button onclick="doLogin()">🔑 Sign In</button>
  <button onclick="doMe()">👤 /auth/me</button>
  <button onclick="clearResults()">🗑 Clear</button>
</div>

<div id="out" class="result">Results will appear here...</div>

<script>
let savedToken = localStorage.getItem('diag_token') || ''

function base() { return document.getElementById('base').value.replace(/\/$/, '') }
function log(msg, ok = true) {
  const d = document.getElementById('out')
  d.className = 'result ' + (ok ? 'ok' : 'err')
  d.textContent = msg
}

async function testHealth() {
  log('Testing ' + base() + '/health ...')
  try {
    const r = await fetch(base() + '/health')
    const t = await r.text()
    log(`✅ Health OK — ${r.status}: ${t}`)
  } catch (e) {
    log(`❌ FAILED: ${e.message}\n\nBackend is not reachable on ${base()}.\nMake sure uvicorn is running!`, false)
  }
}

async function doSignup() {
  const body = { email: document.getElementById('email').value, password: document.getElementById('pass').value, name: document.getElementById('name').value, role: 'Construction Worker' }
  log('POST /auth/signup ...\n' + JSON.stringify(body, null, 2))
  try {
    const r = await fetch(base() + '/auth/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    const t = await r.text()
    const ok = r.ok
    if (ok) {
      const j = JSON.parse(t)
      savedToken = j.access_token
      localStorage.setItem('diag_token', savedToken)
    }
    log(`${ok ? '✅' : '❌'} Status: ${r.status}\n\n${t}`, ok)
  } catch (e) { log('❌ Network error: ' + e.message, false) }
}

async function doLogin() {
  const form = new URLSearchParams()
  form.append('username', document.getElementById('email').value)
  form.append('password', document.getElementById('pass').value)
  log('POST /auth/login (form-data) ...')
  try {
    const r = await fetch(base() + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form })
    const t = await r.text()
    const ok = r.ok
    if (ok) {
      const j = JSON.parse(t)
      savedToken = j.access_token
      localStorage.setItem('diag_token', savedToken)
    }
    log(`${ok ? '✅' : '❌'} Status: ${r.status}\n\nToken saved: ${ok ? 'YES' : 'NO'}\n\n${t}`, ok)
  } catch (e) { log('❌ Network error: ' + e.message, false) }
}

async function doMe() {
  if (!savedToken) { log('No token — login first', false); return }
  log('GET /auth/me ...')
  try {
    const r = await fetch(base() + '/auth/me', { headers: { Authorization: 'Bearer ' + savedToken } })
    const t = await r.text()
    log(`${r.ok ? '✅' : '❌'} Status: ${r.status}\n\n${t}`, r.ok)
  } catch (e) { log('❌ Network error: ' + e.message, false) }
}

function clearResults() { document.getElementById('out').textContent = ''; document.getElementById('out').className = 'result' }

// Auto-test health on load
window.onload = () => testHealth()
</script>
</body>
</html>
